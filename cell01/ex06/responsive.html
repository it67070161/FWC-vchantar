<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            height: 100%;
            border: 1px solid black;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td style="background-color: aquamarine;">
                six seven
            </td>

            <td style="background-color: chartreuse;">
                seven six
            </td>
        </tr>
    </table>

</body>
</html>
